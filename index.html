<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>テンプレ</title>
<style>
  html, body{height:100%; overflow:hidden;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:#111;}
  header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #eee; position:sticky; top:0; z-index:400; background:#fff;}
  h1{margin:0;font-size:18px;}
  .small{font-size:12px;opacity:.75;}
  .join-box{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px; position:relative; z-index:2;}
  .join-box input{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:16px;}
  .btn{padding:6px 10px;border:1px solid #ddd;border-radius:6px;background:#f8f8f8;cursor:pointer;}
  .btn.primary{background:#111;color:#fff;border-color:#111;}
  .btn.ghost{background:transparent;}
  .hidden{display:none;}
  #lobby{padding:20px;border-top:1px solid #eee; position:relative; z-index:2;}
  .copy-btn.copied, .btn.ghost.copied{background:#16a34a;color:#fff;border-color:#16a34a;}

  /* ★ main背景：入室前/入室後で切替 */
  main{
    position:relative;
    height:calc(100vh - 60px);
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
  }
  main.prejoin{ background-image:url('maemain.jpg'); }
  main.joined{ background-image:url('maingazo.jpg'); }

  /* ★ 着席ポップ */
  .seat-pop{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    background:orange;border:1px solid #eee;border-radius:12px;
    box-shadow:0 12px 28px rgba(0,0,0,.12);
    padding:10px;z-index:220;display:flex;flex-direction:column;gap:10px;min-width:280px;
  }
  .seat-pop.hidden{display:none;}
  .seat-pop .row{display:flex;gap:8px;align-items:center;}
  .seat-pop label{width:84px;font-size:13px;}
  .seat-pop .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{padding:6px 10px;border:1px solid #ddd;border-radius:999px;cursor:pointer;user-select:none;position:relative;}
  .tab.disabled{opacity:.45; pointer-events:none;}
  .tab.disabled::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700;color:#b91c1c;pointer-events:none;}
  .tab.active{background:#111;color:#fff;border-color:#111;}

  /* ★ ホスト人数選択中：参加者に出す黒ポップ（下固定） */
  .host-selecting-pop{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
    background:rgba(20,20,20,.92);color:#fff;
    padding:12px 16px;border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    z-index:225;font-weight:800;white-space:nowrap;
    pointer-events:none;
  }
  .host-selecting-pop.hidden{display:none;}

  /* ★ プレイヤー円配置用 */
  .player-circle{
    position:relative;width:260px;height:260px;
    margin:20px auto 0;border-radius:50%;
    box-sizing:border-box;border:none;
  }
  .player-circle::before{content:'';}

  .player-tag{
    position:absolute;transform:translate(-50%,-50%);
    padding:4px 8px;border-radius:999px;background:#f8f8f8;
    border:1px solid #ddd;font-size:12px;white-space:nowrap;
    z-index:20;
  }
  .player-tag.me{ background:#111;color:#fff;border-color:#111; }
  .player-tag .mini-hand.next-turn-target::before{
    border-color:#2563eb;
    border-style:solid;
    border-width:3px;
  }
  .player-tag .mini-hand.next-turn-target.drop-ready::before{
    background:rgba(37,99,235,.14);
  }
  .deck-wrap.next-turn-target::before{
    border-color:#2563eb;
    border-style:solid;
    border-width:3px;
  }
  .deck-wrap.next-turn-target.drop-ready::before{
    background:rgba(37,99,235,.14);
  }

  /* =========================
     ★ 山札（プレイヤーサークル中心）
     ========================= */
  .deck-wrap{
    position:absolute;left:calc(50% - var(--deck-offset-x));top:70%;
    transform:translate(-50%,-50%);
    z-index:10;
    display:flex;align-items:center;justify-content:center;
    width:var(--zone-circle-size);
    height:var(--zone-circle-size);
  }
  .deck-wrap::before,
  .mini-hand::before{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    width:var(--zone-circle-size);
    height:var(--zone-circle-size);
    border:2px dashed rgba(17,17,17,.4);
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-sizing:border-box;
    pointer-events:none;
  }
  :root{
    --offsetX:0.4px;
    --offsetY:0.4px;
    --outX:66px;
    --tiltBase:0deg;
    --tiltMore:10deg;
    --durOut:220ms;
    --durIn:220ms;
    --pause:20ms;
    --zone-circle-size:96px;
    --mini-zone-scale:0.9;
    --deck-offset-x:18px;
  }
  .shuffle-deck{
    position:relative;
    width:54px;
    height:81px;
    --stack-offset-x:var(--offsetX);
    --stack-offset-y:var(--offsetY);
    transform:scale(var(--mini-zone-scale));
    transform-origin:center;
  }
  .shuffle-card{
    position:absolute;
    inset:0;
    width:54px;height:81px;border-radius:10px;
    border:3px solid #fff;
    box-shadow:
      0 0 0 1px #000,
      0 4px 12px rgba(0,0,0,.15);
    background:#fff;
    overflow:hidden;
    position:absolute;
    user-select:none;
  }
  .shuffle-card img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.05);
    transform-origin:center;
  }
  .shuffle-card.back{
    transform: translate(var(--stack-offset-x), var(--stack-offset-y)) rotate(0deg);
    z-index:1;
  }
  .shuffle-card.front{
    transform: translate(0,0) rotate(0deg);
    z-index:2;
  }
  .shuffle-card.movingOut{
    transition: transform var(--durOut) ease-in-out;
    transform: translate(var(--outX), 0) rotate(calc(var(--tiltBase) + var(--tiltMore)));
  }
  .shuffle-card.movingIn{
    transition: transform var(--durIn) ease-in-out;
    transform: translate(var(--stack-offset-x), var(--stack-offset-y)) rotate(var(--tiltBase));
  }

  .deal-fly-card{
    position:fixed;
    width:54px;
    height:81px;
    border-radius:10px;
    border:3px solid #fff;
    box-shadow:0 0 0 1px #000, 0 12px 24px rgba(0,0,0,.28);
    overflow:hidden;
    z-index:500;
    pointer-events:none;
  }
  .deal-fly-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.05);
  }
  .deal-fly-card.deck-size{
    width:calc(54px * var(--mini-zone-scale));
    height:calc(81px * var(--mini-zone-scale));
    border-radius:calc(10px * var(--mini-zone-scale));
    border-width:calc(3px * var(--mini-zone-scale));
  }
  .deal-fly-card.deck-size img{
    transform:none;
  }
  .count-badge{
    position:absolute;right:4px;top:4px;
    min-width:18px;height:18px;
    padding:0 5px;
    border-radius:999px;
    background:rgba(17,17,17,.92);
    color:#fff;
    font-size:11px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .deck-exile-tray{
    position:absolute;
    left:calc(100% + 12px);
    top:50%;
    transform:translateY(-50%);
    display:flex;
    gap:8px;
    pointer-events:none;
    opacity:0;
  }
  .deck-exile-tray.visible{
    opacity:1;
  }
  .deck-exile-card{
    width:calc(54px * var(--mini-zone-scale));
    height:calc(81px * var(--mini-zone-scale));
    border-radius:10px;
    border:3px solid #fff;
    box-shadow:0 0 0 1px #000, 0 4px 12px rgba(0,0,0,.2);
    background:#fff;
    overflow:hidden;
  }
  .deck-exile-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.05);
  }

  /* 他プレイヤーのミニカード（ネームタグの下に扇状） */
  .player-tag .mini-hand{
    position:absolute;left:50%;top:100%;
    transform:translate(-50%,6px) scale(var(--mini-zone-scale));
    transform-origin:top center;
    width:var(--zone-circle-size);
    height:var(--zone-circle-size);
    pointer-events:none;
  }
  .player-tag .mini-hand.next-turn-target{
    pointer-events:auto;
  }
  .player-tag .mini-card{
    pointer-events:none;
    position:absolute;left:50%;top:8px;
    width:54px;height:81px;
    border-radius:10px;
    border:3px solid #fff;
    box-shadow:
      0 0 0 1px #000,
      0 4px 12px rgba(0,0,0,.15);
    overflow:hidden;
    transform-origin:bottom center;
    background:#fff;
  }
  .player-tag .mini-card img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.05);
    transform-origin:center;
  }

  /* 自分の手札表示（既存のまま：60x90） */
  .my-hand-wrapper{margin-top:52px;text-align:center;}
  .my-hand-title{display:none;}
  .my-hand{display:flex;justify-content:center;gap:8px;margin-top:6px;min-height:100px;}

  /* ★ カード共通：白枠3px＋外側に黒枠1px */
  .card{
    width:60px;height:90px;border-radius:10px;
    border:3px solid #fff;
    box-shadow:
      0 0 0 1px #000,
      0 4px 12px rgba(0,0,0,.15);
    background:#fff;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
  }
  .card.dragging-source{
    visibility:visible;
    opacity:1;
    filter:none;
  }
  .card.pointer-dragging-source{
    visibility:hidden;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform: scale(1.1);
    transform-origin: center;
  }
  .pointer-drag-ghost{
    position:fixed;
    left:0;
    top:0;
    pointer-events:none;
    z-index:800;
  }

  /* ★ 追い出し確認ダイアログ */
  .dialog-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;z-index:300;
  }
  .dialog-backdrop.hidden{display:none;}
  .dialog-box{
    background:#fff;border-radius:12px;padding:16px 18px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    max-width:320px;width:calc(100% - 40px);
  }
  .dialog-box p{margin:0 0 12px;font-size:14px;line-height:1.6;}
  .dialog-buttons{display:flex;justify-content:flex-end;gap:8px;}

  /* ★ ホスト用 設定ボタン（右下固定） */
  .host-settings-btn{
    position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;
    border:1px solid #ddd;background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18);
    display:none;align-items:center;justify-content:center;font-size:22px;cursor:pointer;z-index:230;
  }
  .host-settings-btn.visible{display:flex;}

  /* ★ 設定ポップ（ホスト専用パネル） */
  .start-pop{
    position:fixed;right:16px;bottom:72px;background:#fff;border:1px solid #ddd;border-radius:12px;
    box-shadow:0 12px 28px rgba(0,0,0,.16);padding:10px 12px;z-index:240;min-width:260px;
    display:flex;flex-direction:column;gap:8px;
  }
  .start-pop.hidden{display:none;}
  .start-pop-header{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .start-pop-title{font-size:14px;font-weight:600;}
  .start-pop-main{font-size:13px;line-height:1.5;}
  .start-pop-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;flex-wrap:wrap;}

  /* 詳細情報消す用 */
  #roomInfoLobby, #lobby h2, #lobby p {display:none;}
  #lobby.entered{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:calc(100vh - 60px);
  }

  /* =========================
     ★ 左下「？」ボタン
     ========================= */
  .help-btn{
    position:fixed;left:16px;bottom:16px;width:44px;height:44px;border-radius:50%;
    border:1px solid #111;background:#111;color:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
    display:none;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;cursor:pointer;z-index:230;
  }
  .help-btn.visible{display:flex;}

  /* ★ ヘルプ一覧ポップ */
  .help-pop-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:310;
    padding:16px;
  }
  .help-pop-backdrop.hidden{display:none;}
  .help-pop{
    width:min(560px, calc(100% - 0px));
    max-height:min(75vh, 720px);
    background:#fff;border:1px solid #ddd;border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .help-pop-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;border-bottom:1px solid #eee;
  }
  .help-pop-title{font-weight:800;font-size:14px;}
  .help-pop-body{padding:12px;overflow:auto;max-height:calc(75vh - 48px);}

  /* ★ カード一覧：4枚横並び */
  .help-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:10px;
  }
  .help-grid .card{
    width:100%;
    max-width:84px;
    height:auto;
    aspect-ratio:2 / 3;
  }
  .help-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:default;
  }
  .help-item.host-clickable{cursor:pointer;}
  .help-item.disabled{opacity:.25;}
  .help-timer-item{
    border:1px solid #ddd;
    border-radius:12px;
    padding:8px 6px;
    background:#fafafa;
    min-height:126px;
    width:100%;
    box-sizing:border-box;
    gap:6px;
  }
  .help-timer-btns{
    display:grid;
    grid-template-columns:1fr;
    gap:6px;
    width:100%;
  }
  .help-timer-btn{
    width:100%;
    font-weight:700;
    font-size:12px;
    padding:6px 0;
  }
  .help-timer-btn.active{
    background:#111;
    color:#fff;
    border-color:#111;
  }

  .announce-pop{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%, -50%);
    padding:8px 16px;
    border-radius:6px;
    background:rgba(17,17,17,.92);
    color:#fff;
    font-size:22px;
    font-weight:900;
    letter-spacing:.04em;
    box-shadow:0 12px 24px rgba(0,0,0,.3);
    z-index:420;
    pointer-events:none;
    opacity:0;
    white-space:nowrap;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .announce-pop.run{
    animation:announceSlide 3.6s ease-in-out forwards;
  }
  @keyframes announceSlide{
    0%{ transform:translate(-180vw, -50%); opacity:0; }
    16%{ transform:translate(-50%, -50%); opacity:1; }
    66%{ transform:translate(-50%, -50%); opacity:1; }
    100%{ transform:translate(160vw, -50%); opacity:0; }
  }

  .discussion-timer{
    position:absolute;
    top:14px;
    right:14px;
    width:70px;
    height:70px;
    border-radius:50%;
    border:6px solid #8b5a2b;
    display:none;
    align-items:center;
    justify-content:center;
    z-index:410;
    box-shadow:none;
  }
  .discussion-timer.visible{ display:flex; }
  .discussion-timer .inner{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#111;
    font-weight:900;
    line-height:1;
    font-size:20px;
  }
</style>
</head>
<body>

<header>
  <h1>テンプレ</h1>
  <div style="display:flex;align-items:center;gap:6px;">
    <div class="small" id="roomInfo"></div>
    <button class="btn ghost" id="copyLinkBtn">COPY</button>
  </div>
</header>

<main id="main" class="prejoin">
  <div class="join-box" id="joinBox">
    <input id="userName" placeholder="名前（4文字以内）" maxlength="4" />
    <input id="roomCode" placeholder="ルームコード（未入力で自動生成）" maxlength="12" />
    <button class="btn primary" id="btnJoin">入室</button>
  </div>

  <div id="lobby" class="hidden">
    <h2>ロビー</h2>
    <div id="roomInfoLobby" style="margin-bottom:8px;"></div>
    <p>ここにテーブルや情報が表示されます。</p>

    <div id="playerCircle" class="player-circle"></div>

    <div class="my-hand-wrapper">
      <div class="my-hand-title">自分のカード</div>
      <div id="myHand" class="my-hand"></div>
    </div>
  </div>
  <div id="discussionTimer" class="discussion-timer" aria-live="polite">
    <div id="discussionTimerInner" class="inner">04:00</div>
  </div>
</main>

<div id="announcePop" class="announce-pop" aria-live="polite"></div>

<!-- ★ 参加者：ホスト人数選択中ポップ -->
<div id="hostSelectingPop" class="host-selecting-pop hidden">ホストが人数を選択中</div>

<!-- 着席ポップ -->
<div id="seatPop" class="seat-pop hidden">
  <div class="row"><label>席を選択</label><div id="seatTabs" class="tabs"></div></div>
  <div class="row" style="justify-content:flex-end">
    <button class="btn small ghost" id="btnSeatCancel">観戦</button>
  </div>
</div>

<!-- 既存プレイヤー追い出し確認ポップ -->
<div id="kickDialog" class="dialog-backdrop hidden">
  <div class="dialog-box" id="kickDialogBox">
    <p id="kickMessage">既存のプレイヤーを追い出して、着席しますか？</p>
    <div class="dialog-buttons">
      <button class="btn ghost" id="btnKickNo">いいえ</button>
      <button class="btn primary" id="btnKickYes">はい</button>
    </div>
  </div>
</div>

<!-- ホスト専用 設定ボタン（⚙） -->
<button id="hostSettingsBtn" class="host-settings-btn" title="設定">⚙</button>

<!-- ★ ヘルプボタン（？） -->
<button id="helpBtn" class="help-btn" title="カード一覧">？</button>

<!-- ★ ヘルプ一覧ポップ -->
<div id="helpBackdrop" class="help-pop-backdrop hidden">
  <div class="help-pop" role="dialog" aria-modal="true" aria-label="カード一覧">
    <div class="help-pop-header">
      <div class="help-pop-title">カード一覧（濃い＝デッキ投入）</div>
      <button id="btnHelpClose" class="btn ghost" style="padding:2px 6px;font-size:12px;">×</button>
    </div>
    <div class="help-pop-body" id="helpBody"></div>
  </div>
</div>

<!-- 設定ポップ（スタート＋リセット） -->
<div id="startPop" class="start-pop hidden">
  <div class="start-pop-header">
    <div class="start-pop-title">ホスト設定</div>
    <button id="btnStartPopClose" class="btn ghost" style="padding:2px 6px;font-size:12px;">×</button>
  </div>
  <div class="start-pop-main">
    「スタート」で場をリセット後にシャッフルし、ランダムな開始プレイヤー1人に2枚配布。<br>
    山札はプレイヤーサークル中央に表示（右上に枚数タグ）。<br>
    「リセット」で人数選択へ戻します。
  </div>
  <div class="start-pop-actions">
    <button id="btnResetRoom" class="btn ghost">リセット</button>
    <button id="btnGameStart" class="btn primary">スタート</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getDatabase, ref, set, get, update, onValue, remove
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// ▼ Firebase 設定
const firebaseConfig = {
  apiKey: "AIzaSyDUP1foVQnitM45do_UtYLkcc9gvgQC-xw",
  authDomain: "timebomb-3b0c7.firebaseapp.com",
  databaseURL: "https://timebomb-3b0c7-default-rtdb.firebaseio.com",
  projectId: "timebomb-3b0c7",
  storageBucket: "timebomb-3b0c7.firebasestorage.app",
  messagingSenderId: "532935786630",
  appId: "1:532935786630:web:ef1f97c862bfaad67d1107",
  measurementId: "G-K8NRR8K64Y"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ★ userId をタブ単位で固定（タブごとに別ID）
const savedUserId = sessionStorage.getItem('bbUserId') || crypto.randomUUID();
sessionStorage.setItem('bbUserId', savedUserId);

// ▼ 裏面画像（デッキ＆他プレイヤー用）

// ========= ユーティリティ =========
function generateRoomCode(length = 6){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let code = '';
  for(let i=0;i<length;i++) code += chars.charAt(Math.floor(Math.random()*chars.length));
  return code;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function cardImg(name){
  // 画像名.jpg ルール
  return `${name}.jpg`;
}
function cssMs(name){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  if(v.endsWith('ms')) return parseFloat(v);
  if(v.endsWith('s')) return parseFloat(v) * 1000;
  return parseFloat(v) || 0;
}
function wait(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}
function speedAdjustedMs(baseMs){
  return Math.round(baseMs / CARD_MOVE_SPEED_RATIO);
}
function applyCardAnimationSpeed(){
  document.documentElement.style.setProperty('--durOut', `${speedAdjustedMs(220)}ms`);
  document.documentElement.style.setProperty('--durIn', `${speedAdjustedMs(220)}ms`);
  document.documentElement.style.setProperty('--pause', `${speedAdjustedMs(20)}ms`);
}
function defaultDeckConfig(){
  const o = {};
  CARDS.forEach(n => o[n] = true); // 初期は全部濃い（投入）
  return o;
}
function getDiscussionDurationSec(){
  const sec = Number(state.room && state.room.discussionDurationSec);
  return Number.isFinite(sec) && sec > 0 ? sec : DEFAULT_DISCUSSION_DURATION_SEC;
}
applyCardAnimationSpeed();
function updateDeckOffsetByConfig(){
  const hasSpecialCard = (state.deckConfig[SPECIAL_DECK_OFFSET_CARD] !== false);
  document.documentElement.style.setProperty('--deck-offset-x', hasSpecialCard ? '45px' : '0px');
}

// ========= ヘルプ（カード一覧） =========
function renderHelpGrid(){
  helpBody.innerHTML = '';

  const grid = document.createElement('div');
  grid.className = 'help-grid';

  CARDS.forEach((name) => {
    const item = document.createElement('div');
    item.className = 'help-item' + (state.isHost ? ' host-clickable' : '');

    const enabled = (state.deckConfig[name] !== false);
    if(!enabled) item.classList.add('disabled');

    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.alt = name;
    img.src = cardImg(name);
    img.loading = 'lazy';
    card.appendChild(img);

    item.appendChild(card);

    // ★ ホストだけクリックでON/OFF
    item.addEventListener('click', async () => {
      if(!state.isHost) return;
      if(!state.roomCode) return;
      const next = !(state.deckConfig[name] !== false); // 現在trueならfalseへ、falseならtrueへ
      const patch = {};
      patch[`rooms/${state.roomCode}/deckConfig/${name}`] = next;
      await update(ref(db), patch);
    });

    grid.appendChild(item);
  });

  const timerItem = document.createElement('div');
  timerItem.className = 'help-item help-timer-item';

  const timerBtns = document.createElement('div');
  timerBtns.className = 'help-timer-btns';
  const currentTimerSec = getDiscussionDurationSec();

  TIMER_PRESET_SECONDS.forEach((sec) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn help-timer-btn';
    if(sec === currentTimerSec) btn.classList.add('active');
    btn.textContent = formatTimerText(sec);
    btn.disabled = !state.isHost;
    btn.addEventListener('click', async () => {
      if(!state.isHost || !state.roomCode) return;

      timerBtns.querySelectorAll('.help-timer-btn').forEach((el) => el.classList.remove('active'));
      btn.classList.add('active');

      await update(ref(db), {
        [`rooms/${state.roomCode}/discussionDurationSec`]: sec
      });
    });
    timerBtns.appendChild(btn);
  });

  timerItem.appendChild(timerBtns);
  grid.appendChild(timerItem);

  helpBody.appendChild(grid);
}

function showAnnouncePop(text){
  announcePop.textContent = text;
  announcePop.classList.remove('run');
  void announcePop.offsetWidth;
  announcePop.classList.add('run');
}

function clearDiscussionTimer(){
  if(discussionTimerInterval){
    clearInterval(discussionTimerInterval);
    discussionTimerInterval = null;
  }
  discussionTimer.classList.remove('visible');
  discussionTimerInner.textContent = formatTimerText(getDiscussionDurationSec());
}

function formatTimerText(totalSec){
  const sec = Math.max(0, totalSec | 0);
  const min = Math.floor(sec / 60);
  const rem = sec % 60;
  return `${String(min).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
}

function runDiscussionTimer(startedAtMs, durationSec){
  const startMs = Number(startedAtMs || Date.now());
  const useDurationSec = Number(durationSec) > 0 ? Number(durationSec) : getDiscussionDurationSec();
  const endMs = startMs + useDurationSec * 1000;

  clearDiscussionTimer();
  discussionPhaseEnded = false;
  discussionTimer.classList.add('visible');

  const tick = () => {
    const remainMs = Math.max(0, endMs - Date.now());
    const remainSec = Math.ceil(remainMs / 1000);
    discussionTimerInner.textContent = formatTimerText(remainSec);

    if(remainMs <= 0 && !discussionPhaseEnded){
      discussionPhaseEnded = true;
      clearDiscussionTimer();
      showAnnouncePop('投票！');
    }
  };

  tick();
  discussionTimerInterval = setInterval(tick, 250);
}

function syncDiscussionPhase(data){
  if(!data || !data.id){
    lastDiscussionPhaseId = null;
    discussionPhaseEnded = false;
    clearDiscussionTimer();
    return;
  }

  if(lastDiscussionPhaseId === data.id) return;
  lastDiscussionPhaseId = data.id;
  showAnnouncePop('議論開始！');
  runDiscussionTimer(data.startedAt, data.durationSec);
}

// ========= Firebase subscribe =========
function subscribeRoom(){
  const roomRef = ref(db, `rooms/${state.roomCode}`);
  onValue(roomRef, snap => {
    state.room = snap.val() || {};
    const waiting = (!state.isHost && !state.room.maxPlayers);
    hostSelectingPop.classList.toggle('hidden', !waiting);
    syncDiscussionPhase(state.room.discussionPhase || null);
    syncSeatUI();
    if(!helpBackdrop.classList.contains('hidden')) renderHelpGrid();
  });
}
function subscribeHostState(){
  const hostRef = ref(db, `rooms/${state.roomCode}/hostId`);
  onValue(hostRef, snap => {
    const hostId = snap.val();
    state.isHost = (hostId === state.userId);
    updateHostUI();
    syncSeatUI();
    // 開いているヘルプも再描画（クリック可/不可反映）
    if(!helpBackdrop.classList.contains('hidden')) renderHelpGrid();
  });
}
function subscribeHands(){
  const handsRef = ref(db, `rooms/${state.roomCode}/hands`);
  onValue(handsRef, snap => {
    state.hands = snap.val() || {};
    renderHands();
  });
}
function subscribeDeckConfig(){
  const cfgRef = ref(db, `rooms/${state.roomCode}/deckConfig`);
  onValue(cfgRef, async snap => {
    const data = snap.val();
    state.deckConfig = data ? data : defaultDeckConfig();

    // 初回（存在しない）ならDBに初期値を作る（ホストのみ）
    if(!data && state.isHost){
      await set(cfgRef, defaultDeckConfig());
    }

    updateDeckOffsetByConfig();

    // ヘルプ表示中なら即反映
    if(!helpBackdrop.classList.contains('hidden')) renderHelpGrid();
  });
}
// ★ 山札 subscribe（残り配列）
function subscribeDeck(){
  const deckRef = ref(db, `rooms/${state.roomCode}/deck`);
  onValue(deckRef, snap => {
    const d = snap.val();
    state.deck = Array.isArray(d) ? d : [];
    // 既に円が描画されていれば更新
    if (latestPlayers.length) renderPlayerCircle(latestPlayers);
  });
}
function subscribeStartAnimation(){
  const animRef = ref(db, `rooms/${state.roomCode}/startAnimation`);
  onValue(animRef, snap => {
    const data = snap.val();
    if(!data || !data.id || data.status !== 'run') return;
    if(lastStartAnimationId === data.id) return;
    lastStartAnimationId = data.id;
    runStartAnimation(data);
  });
}
function subscribeTransferAnimation(){
  const transferRef = ref(db, `rooms/${state.roomCode}/transferAnimation`);
  onValue(transferRef, snap => {
    const data = snap.val();
    if(!data || !data.id) return;
    if(lastTransferAnimationId === data.id) return;
    lastTransferAnimationId = data.id;

    (async () => {
      const isDraggingPlayer = data.fromPlayerId && state.userId && data.fromPlayerId === state.userId;
      const transferTarget = data.transferTarget || 'player';

      if(!isDraggingPlayer && data.fromPlayerId && transferTarget === 'player' && data.toPlayerId){
        applyLocalTransferSourcePreview(data.fromPlayerId, data.transferCardName);
        const transferFly = await animateTransferCardBetweenPlayers(data.fromPlayerId, data.toPlayerId);
        if(transferFly) transferFly.remove();
        applyLocalTransferDestinationPreview(data.toPlayerId, data.transferCardName);
      }

      if(!isDraggingPlayer && data.fromPlayerId && transferTarget === 'deck'){
        applyLocalTransferSourcePreview(data.fromPlayerId, data.transferCardName);
        const transferFly = await animateTransferCardToDeck(data.fromPlayerId);
        if(transferFly) transferFly.remove();
        applyLocalDeckTransferPreview(data.transferCardName);
      }

      if(data.hasDrawCard && data.toPlayerId){
        await wait(TRANSFER_TO_DRAW_DELAY_MS);
        applyLocalDeckDrawPreview(data.drawCardName);
        const drawFly = await animateDealCardToPlayer(data.toPlayerId);
        if(drawFly) drawFly.remove();
      }
    })();
  });
}


// ========= 手札描画（画像表示） =========
function cleanupPointerDragState(options = {}){
  if(!activePointerDrag) return;
  const { keepSourceHidden = false } = options;
  const { cardEl, ghostEl, dropTargetEl, pointerId } = activePointerDrag;
  if(cardEl && !keepSourceHidden) cardEl.classList.remove('pointer-dragging-source');
  if(ghostEl) ghostEl.remove();
  if(dropTargetEl) dropTargetEl.classList.remove('drop-ready');
  if(cardEl && pointerId != null){
    try { cardEl.releasePointerCapture(pointerId); } catch (_e) {}
  }
  activePointerDrag = null;
}

function findTurnDropTarget(){
  return document.querySelector('[data-drop-target="active"]');
}

function setPointerGhostPosition(clientX, clientY){
  if(!activePointerDrag || !activePointerDrag.ghostEl) return;
  const { ghostEl, offsetX, offsetY } = activePointerDrag;
  ghostEl.style.transform = `translate(${Math.round(clientX - offsetX)}px, ${Math.round(clientY - offsetY)}px)`;
}

function updateDropReadyState(clientX, clientY){
  if(!activePointerDrag) return;
  const target = findTurnDropTarget();
  if(!target){
    if(activePointerDrag.dropTargetEl){
      activePointerDrag.dropTargetEl.classList.remove('drop-ready');
      activePointerDrag.dropTargetEl = null;
    }
    return;
  }
  const rect = target.getBoundingClientRect();
  const isInside = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
  if(isInside){
    if(activePointerDrag.dropTargetEl && activePointerDrag.dropTargetEl !== target){
      activePointerDrag.dropTargetEl.classList.remove('drop-ready');
    }
    target.classList.add('drop-ready');
    activePointerDrag.dropTargetEl = target;
  }else if(activePointerDrag.dropTargetEl){
    activePointerDrag.dropTargetEl.classList.remove('drop-ready');
    activePointerDrag.dropTargetEl = null;
  }
}

async function finishPointerDrag(clientX, clientY){
  if(!activePointerDrag) return;
  const { cardIndex: draggedIndex, dropTargetEl, cardEl } = activePointerDrag;
  const shouldDrop = !!dropTargetEl;
  cleanupPointerDragState({ keepSourceHidden: shouldDrop });
  if(!shouldDrop) return;
  const transferType = dropTargetEl.dataset.transferTarget;
  const transferred = (transferType === 'deck')
    ? await transferCardToDeck(draggedIndex)
    : await transferCardToNextPlayer(draggedIndex);
  if(!transferred && cardEl){
    cardEl.classList.remove('pointer-dragging-source');
  }
}

function startPointerCardDrag(cardEl, cardIndex, ev){
  if(ev.button !== 0 || isTransferringCard) return;
  const target = findTurnDropTarget();
  if(!target) return;

  ev.preventDefault();
  cleanupPointerDragState();

  const rect = cardEl.getBoundingClientRect();
  const ghost = cardEl.cloneNode(true);
  ghost.classList.remove('pointer-dragging-source');
  ghost.classList.add('pointer-drag-ghost');
  ghost.style.opacity = '1';
  ghost.style.filter = 'none';
  document.body.appendChild(ghost);

  activePointerDrag = {
    cardEl,
    cardIndex,
    ghostEl: ghost,
    dropTargetEl: null,
    pointerId: ev.pointerId,
    offsetX: ev.clientX - rect.left,
    offsetY: ev.clientY - rect.top,
  };

  cardEl.classList.add('pointer-dragging-source');
  cardEl.setPointerCapture(ev.pointerId);
  setPointerGhostPosition(ev.clientX, ev.clientY);
  updateDropReadyState(ev.clientX, ev.clientY);

  const onMove = (moveEv) => {
    if(!activePointerDrag || moveEv.pointerId !== activePointerDrag.pointerId) return;
    setPointerGhostPosition(moveEv.clientX, moveEv.clientY);
    updateDropReadyState(moveEv.clientX, moveEv.clientY);
  };

  const onUp = async (upEv) => {
    if(!activePointerDrag || upEv.pointerId !== activePointerDrag.pointerId) return;
    cardEl.removeEventListener('pointermove', onMove);
    cardEl.removeEventListener('pointerup', onUp);
    cardEl.removeEventListener('pointercancel', onCancel);
    await finishPointerDrag(upEv.clientX, upEv.clientY);
  };

  const onCancel = () => {
    cardEl.removeEventListener('pointermove', onMove);
    cardEl.removeEventListener('pointerup', onUp);
    cardEl.removeEventListener('pointercancel', onCancel);
    cleanupPointerDragState();
  };

  cardEl.addEventListener('pointermove', onMove);
  cardEl.addEventListener('pointerup', onUp);
  cardEl.addEventListener('pointercancel', onCancel);
}

function renderMyHand(){
  cleanupPointerDragState();
  myHandEl.innerHTML = '';
  const myId = state.userId;
  const handData = state.hands[myId];
  if (!handData || !Array.isArray(handData.cards)) return;

  const canTransfer = handData.cards.length === 2 && !!getTurnTransferTarget();

  handData.cards.forEach((name, idx) => {
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.alt = name;
    img.src = cardImg(name);
    img.loading = 'lazy';
    img.draggable = false;

    card.appendChild(img);

    if(canTransfer){
      card.style.cursor = 'grab';
      card.style.touchAction = 'none';
      card.addEventListener('pointerdown', (e) => startPointerCardDrag(card, idx, e));
    }

    myHandEl.appendChild(card);
  });
}
function renderHands(){

const roomFromUrl = urlParams.get('room');

async function restoreSeatFromDB(){
  if (!state.roomCode) return;
  const tablesRef = ref(db, `rooms/${state.roomCode}/tables`);
  const snap = await get(tablesRef);
  const data = snap.val() || {};
  let mySeatIndex = null;

  for (const [seatIndex, t] of Object.entries(data)) {
    if (t && t.playerId === state.userId) {
      mySeatIndex = Number(seatIndex);
      break;
    }
  }
  if (mySeatIndex !== null) state.seatedTable = mySeatIndex;
}

btnJoin.addEventListener('click', async () => {
  state.userName = inputName.value || '名無し';
  state.roomCode = inputCode.value.trim() || generateRoomCode();

  await set(ref(db, `rooms/${state.roomCode}/users/${state.userId}`), {
    name: state.userName,
    joinedAt: Date.now()
  });

  const roomRef = ref(db, `rooms/${state.roomCode}`);
  const roomSnap = await get(roomRef);
  const roomData = roomSnap.val();

  if(!roomData || !roomData.hostId){
    await update(roomRef, { hostId: state.userId });
    state.isHost = true;
  } else {
    state.isHost = (roomData.hostId === state.userId);
  }

  // deckConfig 初期化（ホストのみが作成する想定）
  if(state.isHost){
    const cfgRef = ref(db, `rooms/${state.roomCode}/deckConfig`);
    const cfgSnap = await get(cfgRef);
    if(!cfgSnap.exists()){
      await set(cfgRef, defaultDeckConfig());
    }
  }

  updateHostUI();

  mainEl.classList.remove('prejoin');
  mainEl.classList.add('joined');

  joinBox.classList.add('hidden');
  lobby.classList.remove('hidden');
  lobby.classList.add('entered');

  await restoreSeatFromDB();

  subscribeRoom();
  subscribeHostState();
  subscribePlayers();
  subscribeHands();
  subscribeDeckConfig();
  subscribeDeck(); // ★ 山札
  subscribeStartAnimation();
  subscribeTransferAnimation();

  syncSeatUI();
});

async function syncSeatUI(){
  if (!state.roomCode) return;

  const maxPlayers = state.room.maxPlayers || null;

  if (!state.isHost && !maxPlayers){
    seatPop.classList.add('hidden');
    return;
  }
  if (state.seatedTable !== null){
    seatPop.classList.add('hidden');
    return;
  }
  await renderSeatTabs();
  seatPop.classList.remove('hidden');
}

async function renderSeatTabs(){
  if (!state.roomCode) return;
  if (isRenderingSeatTabs) return;
  isRenderingSeatTabs = true;

  try {
    seatTabs.innerHTML = '';

    const roomRef = ref(db, `rooms/${state.roomCode}`);
    const roomSnap = await get(roomRef);
    const roomData = roomSnap.val() || {};
    const maxPlayers = roomData.maxPlayers || null;

    if(state.isHost && !maxPlayers){
      seatLabel.textContent = '人数を選択';
      for(let i=2; i<=8; i++){
        const tab = document.createElement('div');
        tab.className = 'tab';
        tab.textContent = i;

        tab.onclick = async () => {
          await update(roomRef, { maxPlayers: i });
          const tRef = ref(db, `rooms/${state.roomCode}/tables/1`);
          await set(tRef, { playerId: state.userId, playerName: state.userName });

          state.seatedTable = 1;
          seatPop.classList.add('hidden');
        };
        seatTabs.appendChild(tab);
      }
      return;
    }

    seatLabel.textContent = '席を選択';

    const effectiveMax = maxPlayers || 8;
    const tablesSnap = await get(ref(db, `rooms/${state.roomCode}/tables`));
    const tables = tablesSnap.val() || {};

    for(let i=1; i<=effectiveMax; i++){
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.textContent = i;

function subscribePlayers(){
  const tablesRef = ref(db, `rooms/${state.roomCode}/tables`);
  onValue(tablesRef, async snap => {
    const data = snap.val() || {};
    const players = Object.entries(data)
      .map(([seatIndex, t]) => (t && t.playerId ? {
        id: t.playerId,
        name: t.playerName || '名無し',
        seatIndex: Number(seatIndex)
      } : null))
      .filter(Boolean)
      .sort((a,b) => a.seatIndex - b.seatIndex);

    latestPlayers = players;

    const mySeat = players.find(p => p.id === state.userId);
    if (mySeat && state.seatedTable === null) {
      state.seatedTable = mySeat.seatIndex;
      seatPop.classList.add('hidden');
    }

    const meStillSeated = players.some(p => p.id === state.userId);
    if (!meStillSeated && state.seatedTable !== null) {
      state.seatedTable = null;
    }

    await syncSeatUI();
    renderPlayerCircle(players);
  });
}

function renderCenterDeck(){
  const wrap = document.createElement('div');
  wrap.className = 'deck-wrap';
  wrap.dataset.role = 'deck';

  const exileTray = document.createElement('div');
  exileTray.className = 'deck-exile-tray';
  exileTray.dataset.role = 'deck-exile-tray';

  const excludedCards = Array.isArray(state.startExcludedCards) ? state.startExcludedCards : [];
  excludedCards.forEach((name) => {
    const card = document.createElement('div');
    card.className = 'deck-exile-card';
    const img = document.createElement('img');
    img.alt = `除外カード:${name}`;
    img.src = BACK_IMG;
    img.loading = 'lazy';
    card.appendChild(img);
    exileTray.appendChild(card);
  });
  if(excludedCards.length) exileTray.classList.add('visible');

  wrap.appendChild(exileTray);

  const turnTarget = getTurnTransferTarget();
  if(turnTarget === 'deck'){
    wrap.classList.add('next-turn-target');
    wrap.dataset.dropTarget = 'active';
    wrap.dataset.transferTarget = 'deck';
  }

  const deckCount = (state.deck && state.deck.length) ? state.deck.length : 0;
  if(deckCount > 0){
    const shuffleDeck = document.createElement('div');
    shuffleDeck.className = 'shuffle-deck';
    const stackOffset = Math.min(14, 2 + Math.floor((deckCount - 1) / 3));
    shuffleDeck.style.setProperty('--stack-offset-x', `${stackOffset}px`);
    shuffleDeck.style.setProperty('--stack-offset-y', `${stackOffset}px`);

    for(let i = 0; i < deckCount; i++){
      const card = document.createElement('div');
      const offset = (deckCount - 1 - i) * 0.4;
      const isFront = i === deckCount - 1;
      const isBack = i === deckCount - 2;

      card.className = `shuffle-card${isFront ? ' front' : ''}${isBack ? ' back' : ''}`;
      card.style.zIndex = String(i + 1);

      if(!isFront && !isBack){
        card.style.transform = `translate(${offset}px, ${offset}px) rotate(0deg)`;
      }

      if(isFront) card.dataset.role = 'shuffle-front';
      if(isBack) card.dataset.role = 'shuffle-back';

      const img = document.createElement('img');
      img.alt = '山札';
      img.src = BACK_IMG;
      img.loading = 'lazy';
      card.appendChild(img);
      shuffleDeck.appendChild(card);
    }

    const frontCard = shuffleDeck.querySelector('[data-role="shuffle-front"]')
      || shuffleDeck.querySelector('.shuffle-card');

    const badge = document.createElement('div');
    badge.className = 'count-badge';
    badge.dataset.role = 'deck-count';
    badge.textContent = String(deckCount);
    if(frontCard) frontCard.appendChild(badge);

    wrap.appendChild(shuffleDeck);
  }

  if(turnTarget === 'deck'){
    wrap.addEventListener('dragover', (e) => {
      const myHand = state.hands[state.userId] && Array.isArray(state.hands[state.userId].cards)
        ? state.hands[state.userId].cards
        : [];
      if(myHand.length !== 2) return;
      e.preventDefault();
      wrap.classList.add('drop-ready');
    });
    wrap.addEventListener('dragleave', () => {
      wrap.classList.remove('drop-ready');
    });
    wrap.addEventListener('drop', async (e) => {
      e.preventDefault();
      wrap.classList.remove('drop-ready');
      const idx = Number(e.dataTransfer.getData('text/plain'));
      if(Number.isNaN(idx)) return;
      await transferCardToDeck(idx);
    });
  }

  playerCircle.appendChild(wrap);
}

async function animateShuffle3(){
  const deckWrap = playerCircle.querySelector('[data-role="deck"]');
  if(!deckWrap) return;

  let front = deckWrap.querySelector('[data-role="shuffle-front"]');
  let back = deckWrap.querySelector('[data-role="shuffle-back"]');
  if(!front || !back) return;

  const DUR_OUT = cssMs('--durOut');
  const DUR_IN = cssMs('--durIn');
  const PAUSE = cssMs('--pause');

  front.classList.remove('movingOut', 'movingIn');
  back.classList.remove('movingOut', 'movingIn');

  for(let i = 0; i < 3; i++){
    front.classList.remove('movingIn');
    void front.offsetWidth;
    front.classList.add('movingOut');
    await wait(DUR_OUT);

    front.classList.remove('movingOut');

    front.classList.remove('front');
    front.classList.add('back');
    front.dataset.role = 'shuffle-back';

    back.classList.remove('back');
    back.classList.add('front');
    back.dataset.role = 'shuffle-front';

    const tmp = front;
    front = back;
    back = tmp;

    back.classList.remove('movingOut');
    void back.offsetWidth;
    back.classList.add('movingIn');
    await wait(DUR_IN);

    back.classList.remove('movingIn');
    await wait(PAUSE);
  }
}

function getNextPlayerId(){
  const n = latestPlayers.length;
  if(n < 2) return null;
  const myIndex = latestPlayers.findIndex(p => p.id === state.userId);
  if(myIndex === -1) return null;
  const next = latestPlayers[(myIndex + 1) % n];
  return next ? next.id : null;
}

function getTurnTransferTarget(){
  const nextPlayerId = getNextPlayerId();
  if(!nextPlayerId || nextPlayerId === state.userId) return null;
  const startPlayerId = state.room && state.room.startPlayerId;
  if(startPlayerId && nextPlayerId === startPlayerId) return 'deck';
  return 'player';
}

async function transferCardToNextPlayer(cardIndex){
  if(isTransferringCard || !state.roomCode) return false;
  if(getTurnTransferTarget() !== 'player') return false;
  const nextPlayerId = getNextPlayerId();
  if(!nextPlayerId || nextPlayerId === state.userId) return false;

  const myHand = state.hands[state.userId] && Array.isArray(state.hands[state.userId].cards)
    ? state.hands[state.userId].cards.slice()
    : [];
  if(myHand.length !== 2) return false;

  const movingCard = myHand[cardIndex];
  if(!movingCard) return false;

  isTransferringCard = true;
  const prevHands = state.hands;
  try {
    const nextHand = state.hands[nextPlayerId] && Array.isArray(state.hands[nextPlayerId].cards)
      ? state.hands[nextPlayerId].cards.slice()
      : [];

    const myFinal = myHand.filter((_, i) => i !== cardIndex);
    const afterTransfer = [...nextHand, movingCard];

    state.hands = {
      ...state.hands,
      [state.userId]: { cards: myFinal },
      [nextPlayerId]: { cards: afterTransfer }
    };
    renderHands();

    const deck = Array.isArray(state.deck) ? state.deck.slice() : [];
    const drawCard = deck.length ? deck[deck.length - 1] : null;

    const transferAnimId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    await update(ref(db), {
      [`rooms/${state.roomCode}/transferAnimation`]: {
        id: transferAnimId,
        actorId: state.userId,
        transferTarget: 'player',
        fromPlayerId: state.userId,
        toPlayerId: nextPlayerId,
        transferCardName: movingCard,
        hasDrawCard: !!drawCard,
        drawCardName: drawCard,
        showToOthers: true,
        createdAt: Date.now()
      }
    });

    await wait(TRANSFER_TO_PLAYER_SYNC_DELAY_MS);

    await update(ref(db), {
      [`rooms/${state.roomCode}/hands/${state.userId}/cards`]: myFinal,
      [`rooms/${state.roomCode}/hands/${nextPlayerId}/cards`]: afterTransfer
    });

    if(!drawCard) return true;

    await wait(TRANSFER_TO_DRAW_DELAY_MS);

    await update(ref(db), {
      [`rooms/${state.roomCode}/hands/${nextPlayerId}/cards`]: [drawCard, ...afterTransfer],
      [`rooms/${state.roomCode}/deck`]: deck.slice(0, -1)
    });

    return true;
  } catch (err) {
    state.hands = prevHands;
    renderHands();
    throw err;
  } finally {
    isTransferringCard = false;
    cleanupPointerDragState();
  }
}

async function transferCardToDeck(cardIndex){
  if(isTransferringCard || !state.roomCode) return false;
  if(getTurnTransferTarget() !== 'deck') return false;

  const myHand = state.hands[state.userId] && Array.isArray(state.hands[state.userId].cards)
    ? state.hands[state.userId].cards.slice()
    : [];
  if(myHand.length !== 2) return false;

  const movingCard = myHand[cardIndex];
  if(!movingCard) return false;

  isTransferringCard = true;
  const prevHands = state.hands;
  const prevDeck = state.deck;

  try {
    const myFinal = myHand.filter((_, i) => i !== cardIndex);
    const nextDeck = Array.isArray(state.deck) ? [...state.deck, movingCard] : [movingCard];

    const transferAnimId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    await update(ref(db), {
      [`rooms/${state.roomCode}/transferAnimation`]: {
        id: transferAnimId,
        actorId: state.userId,
        transferTarget: 'deck',
        fromPlayerId: state.userId,
        transferCardName: movingCard,
        hasDrawCard: false,
        showToOthers: true,
        createdAt: Date.now()
      }
    });

    await wait(TRANSFER_TO_DECK_SYNC_DELAY_MS);

    state.hands = {
      ...state.hands,
      [state.userId]: { cards: myFinal }
    };
    state.deck = nextDeck;
    renderHands();

    await update(ref(db), {
      [`rooms/${state.roomCode}/hands/${state.userId}/cards`]: myFinal,
      [`rooms/${state.roomCode}/deck`]: nextDeck,
      [`rooms/${state.roomCode}/discussionPhase`]: {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        startedAt: Date.now(),
        durationSec: getDiscussionDurationSec()
      }
    });

    return true;
  } catch (err) {
    state.hands = prevHands;
    state.deck = prevDeck;
    renderHands();
    throw err;
  } finally {
    isTransferringCard = false;
    cleanupPointerDragState();
  }
}

async function waitForAnimationLayout(startPlayerId){
  for(let i = 0; i < 20; i++){
    const from = getDeckCenterPoint();
    const to = getDealTargetPoint(startPlayerId);
    if(from && to) return true;
    await wait(100);
  }
  return false;
}

function applyLocalTransferSourcePreview(fromPlayerId, cardName){
  if(!fromPlayerId || !cardName) return;

  const nextHands = { ...state.hands };
  const fromBase = nextHands[fromPlayerId] && Array.isArray(nextHands[fromPlayerId].cards)
    ? nextHands[fromPlayerId].cards.slice()
    : [];

  const removeIndex = fromBase.lastIndexOf(cardName);
  if(removeIndex !== -1){
    fromBase.splice(removeIndex, 1);
  }

  nextHands[fromPlayerId] = { cards: fromBase };
  state.hands = nextHands;
  renderHands();
}

function applyLocalTransferDestinationPreview(toPlayerId, cardName){
  if(!toPlayerId || !cardName) return;

  const nextHands = { ...state.hands };
  const toBase = nextHands[toPlayerId] && Array.isArray(nextHands[toPlayerId].cards)
    ? nextHands[toPlayerId].cards.slice()
    : [];

  if(!toBase.includes(cardName)){
    toBase.push(cardName);
  }

  nextHands[toPlayerId] = { cards: toBase };
  state.hands = nextHands;
  renderHands();
}

function applyLocalDeckTransferPreview(cardName){
  if(!cardName) return;

  state.deck = Array.isArray(state.deck) ? [...state.deck, cardName] : [cardName];
  renderHands();
}

function applyLocalDealPreview(playerId, cardName){
  if(!playerId) return;
  const nextHands = { ...state.hands };
  const base = nextHands[playerId] && Array.isArray(nextHands[playerId].cards)
    ? nextHands[playerId].cards.slice()
    : [];
  if(cardName) base.push(cardName);
  nextHands[playerId] = { cards: base };
  state.hands = nextHands;
  renderHands();
}

function applyLocalDeckDrawPreview(cardName){
  const nextDeck = Array.isArray(state.deck) ? state.deck.slice() : [];
  if(!nextDeck.length) return;

  if(cardName){
    const removeIndex = nextDeck.lastIndexOf(cardName);
    if(removeIndex !== -1){
      nextDeck.splice(removeIndex, 1);
    } else {
      nextDeck.pop();
    }
  } else {
    nextDeck.pop();
  }

  state.deck = nextDeck;
  renderHands();
}

async function runStartAnimation(animData){
  if(!animData || !animData.id) return;
  if(runningStartAnimationId === animData.id) return;
  runningStartAnimationId = animData.id;

  const deals = Number(animData.deals || 2);
  const initialDeckCount = Number(animData.initialDeckCount || 0);
  const startPlayerId = animData.startPlayerId;
  const drawnCards = Array.isArray(animData.drawnCards) ? animData.drawnCards : [];
  const excludedCards = Array.isArray(animData.excludedCards) ? animData.excludedCards : [];
  state.startExcludedCards = [];

  try {
    const ready = await waitForAnimationLayout(startPlayerId);
    if(!ready) return;

    clearDeckExileCards();
    setDeckBadgeCount(initialDeckCount);

    const hasExileAnimation = excludedCards.some(name => !!name);
    const killerPreview = hasExileAnimation ? await animateKillerPeekFromDeck() : null;
    if(killerPreview) await wait(KILLER_PEEK_HOLD_MS);

    for(let i = 0; i < excludedCards.length; i++){
      const excludedName = excludedCards[i] || null;
      if(!excludedName) continue;
      setDeckBadgeCount(Math.max(initialDeckCount - (i + 1), 0));
      await animateExileCardFromDeck(excludedName);
      await wait(70);
    }

    if(killerPreview){
      await animateKillerReturnToDeck(killerPreview);
      await wait(60);
    }

    const deckCountAfterExclusion = Math.max(initialDeckCount - excludedCards.length, 0);
    setDeckBadgeCount(deckCountAfterExclusion);
    await animateShuffle3();

    for(let i = 0; i < deals; i++){
      const dealtName = drawnCards[i] || null;
      const remaining = Math.max(deckCountAfterExclusion - (i + 1), 0);
      setDeckBadgeCount(remaining);
      const fly = await animateDealCardToPlayer(startPlayerId);
      applyLocalDealPreview(startPlayerId, dealtName);
      await wait(40);
      await wait(70);
      if(fly) fly.remove();
    }
  } finally {
    if(runningStartAnimationId === animData.id) runningStartAnimationId = null;
  }
}

function renderPlayerCircle(players){
  playerCircle.innerHTML = '';
  if (!players.length) return;

  // ★ 先に中央の山札を置く（クリックなどは未実装：表示のみ）
  renderCenterDeck();

  const n = players.length;
  const radius = 65;
  const step = (2 * Math.PI) / n;
  const anchorAngle = Math.PI / 2;
  const meIndex = players.findIndex(p => p.id === state.userId);

  players.forEach((p, idx) => {
    const k = (meIndex === -1) ? idx : (idx - meIndex + n) % n;
    const angle = anchorAngle + step * k;

    const x = 50 + radius * Math.cos(angle);
    const y = 50 + radius * Math.sin(angle);

    const tag = document.createElement('div');
    tag.className = 'player-tag' + (p.id === state.userId ? ' me' : '');
    tag.dataset.playerId = p.id;
    tag.textContent = p.name;
    tag.style.left = `${x}%`;
    tag.style.top = `${y}%`;

    const nextPlayerId = getNextPlayerId();
    const turnTarget = getTurnTransferTarget();

    tag.onclick = () => {
      if (p.id === state.userId) return;
      if (!state.roomCode) return;
      if (state.seatedTable !== null) return;

      pendingSeatIndexToSteal = p.seatIndex;
      pendingSeatPlayerIdToSteal = p.id;
      kickMessage.textContent = `「${p.name}」を追い出して、この席に着席しますか？`;
      kickDialog.classList.remove('hidden');
    };

    // 他プレイヤーの手札位置は常に表示し、手札があれば裏面カードを重ねる
    if (p.id !== state.userId){
      const miniHand = document.createElement('div');
      miniHand.className = 'mini-hand';

      if(turnTarget === 'player' && p.id === nextPlayerId){
        miniHand.classList.add('next-turn-target');
        miniHand.dataset.dropTarget = 'active';
        miniHand.dataset.transferTarget = 'player';
        miniHand.addEventListener('dragover', (e) => {
          const myHand = state.hands[state.userId] && Array.isArray(state.hands[state.userId].cards)
            ? state.hands[state.userId].cards
            : [];
          if(myHand.length !== 2) return;
          e.preventDefault();
          miniHand.classList.add('drop-ready');
        });
        miniHand.addEventListener('dragleave', () => {
          miniHand.classList.remove('drop-ready');
        });
        miniHand.addEventListener('drop', async (e) => {
          e.preventDefault();
          miniHand.classList.remove('drop-ready');
          const idx = Number(e.dataTransfer.getData('text/plain'));
          if(Number.isNaN(idx)) return;
          await transferCardToNextPlayer(idx);
        });
      }

      const handData = state.hands[p.id];
      const cards = (handData && Array.isArray(handData.cards)) ? handData.cards : [];
      const count = cards.length;
      const spread = 70;
      const base = (count > 1) ? (-spread/2) : 0;

      cards.forEach((_name, idx2) => {
        const card = document.createElement('div');
        card.className = 'mini-card';

        const img = document.createElement('img');
        img.alt = '裏面';
        img.src = BACK_IMG;
        img.loading = 'lazy';
        card.appendChild(img);

        const angleDeg = (count > 1) ? base + (spread/(count-1))*idx2 : 0;
        card.style.transform = `translate(-50%,0) rotate(${angleDeg}deg)`;
        card.style.zIndex = String(10 + idx2);
        miniHand.appendChild(card);
      });

      tag.appendChild(miniHand);
    }

    playerCircle.appendChild(tag);
  });
}

// ========= 追い出し =========
kickDialog.addEventListener('click', (e) => {
  if (e.target === kickDialog) {
    kickDialog.classList.add('hidden');
    pendingSeatIndexToSteal = null;
    pendingSeatPlayerIdToSteal = null;
  }
});
btnKickNo.addEventListener('click', (e) => {
  e.stopPropagation();
  kickDialog.classList.add('hidden');
  pendingSeatIndexToSteal = null;
  pendingSeatPlayerIdToSteal = null;
});
btnKickYes.addEventListener('click', async (e) => {
  e.stopPropagation();
  if (pendingSeatIndexToSteal == null || !state.roomCode) {
    kickDialog.classList.add('hidden');
    return;
  }

  const seatIndex = pendingSeatIndexToSteal;
  const roomRef = ref(db, `rooms/${state.roomCode}`);
  const roomSnap = await get(roomRef);
  const roomData = roomSnap.val() || {};

  const tRef = ref(db, `rooms/${state.roomCode}/tables/${seatIndex}`);
  await set(tRef, { playerId: state.userId, playerName: state.userName || '名無し' });

  if (roomData.hostId && pendingSeatPlayerIdToSteal && roomData.hostId === pendingSeatPlayerIdToSteal) {
    await update(roomRef, { hostId: state.userId });
  }

  state.seatedTable = seatIndex;

  kickDialog.classList.add('hidden');
  pendingSeatIndexToSteal = null;
  pendingSeatPlayerIdToSteal = null;

  seatPop.classList.add('hidden');
});

// ========= ゲーム開始（シャッフル→開始プレイヤーを1人ランダム→その人に2枚配布） =========
async function dealInitialHands(){
  if (!state.roomCode) return;

  const tablesSnap = await get(ref(db, `rooms/${state.roomCode}/tables`));
  const tables = tablesSnap.val() || {};

  // 濃いカードだけ抽出
  const enabledCards = CARDS.filter(n => state.deckConfig[n] !== false);

  if(enabledCards.length === 0){
    alert('デッキに入るカードが0枚です（ヘルプで濃いカードを1枚以上にしてください）');
    return;
  }

  const players = Object.values(tables)
    .filter(t => t && t.playerId)
    .map(t => t.playerId);

  if(players.length === 0) return;

  const base = `rooms/${state.roomCode}`;
  const resetPatch = {};
  resetPatch[`${base}/hands`] = {};
  resetPatch[`${base}/deck`] = enabledCards.slice();
  resetPatch[`${base}/startPlayerId`] = null;
  resetPatch[`${base}/startAnimation`] = null;
  resetPatch[`${base}/discussionPhase`] = null;
  await update(ref(db), resetPatch);
  state.hands = {};
  state.startExcludedCards = [];
  renderHands();
  await wait(80);

  let deck = shuffle(enabledCards);
  const hasButler = enabledCards.includes(SPECIAL_DECK_OFFSET_CARD);
  const excludedCards = [];

  if(hasButler){
    for(let i = 0; i < 2; i++){
      const candidates = deck
        .map((name, idx) => ({ name, idx }))
        .filter(({ name }) => name !== '殺人鬼');
      if(!candidates.length) break;
      const picked = candidates[Math.floor(Math.random() * candidates.length)];
      excludedCards.push(picked.name);
      deck.splice(picked.idx, 1);
    }
  }

  const startPlayerId = players[Math.floor(Math.random() * players.length)];
  const drawnCards = [];
  for (let i = 0; i < 2; i++){
    if(deck.length === 0) deck = shuffle(enabledCards);
    drawnCards.push(deck.pop());
  }
  const startAnimationId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

  const animPatch = {};
  animPatch[`rooms/${state.roomCode}/startAnimation`] = {
    id: startAnimationId,
    status: 'run',
    startPlayerId,
    deals: 2,
    drawnCards,
    excludedCards,
    initialDeckCount: enabledCards.length,
    createdAt: Date.now()
  };
  lastStartAnimationId = startAnimationId;
  await update(ref(db), animPatch);
  await runStartAnimation(animPatch[`rooms/${state.roomCode}/startAnimation`]);

  const hands = {};
  players.forEach(pid => {
    hands[pid] = { cards: [] };
  });
  hands[startPlayerId].cards = drawnCards.slice();

  const patch = {};
  patch[`rooms/${state.roomCode}/hands`] = hands;
  patch[`rooms/${state.roomCode}/deck`]  = deck;
  patch[`rooms/${state.roomCode}/startPlayerId`] = startPlayerId;
  await update(ref(db), patch);
}

// ========= ホスト設定ポップ =========
hostSettingsBtn.addEventListener('click', () => {
  if (!state.isHost) return;
  startPop.classList.toggle('hidden');
});
btnStartPopClose.addEventListener('click', () => {
  startPop.classList.add('hidden');
});

btnGameStart.addEventListener('click', async () => {
  if (!state.isHost || startRunning) return;
  startRunning = true;
  btnGameStart.disabled = true;
  try {
    await dealInitialHands();
    startPop.classList.add('hidden');
  } finally {
    btnGameStart.disabled = false;
    startRunning = false;
  }
});

btnResetRoom.addEventListener('click', async () => {
  if (!state.isHost || !state.roomCode) return;

  const base = `rooms/${state.roomCode}`;
  await Promise.all([
    remove(ref(db, `${base}/maxPlayers`)),
    remove(ref(db, `${base}/tables`)),
    remove(ref(db, `${base}/hands`)),
    remove(ref(db, `${base}/deck`)),        // ★ 山札も消す
    remove(ref(db, `${base}/startPlayerId`)),
    remove(ref(db, `${base}/startAnimation`)),
    remove(ref(db, `${base}/transferAnimation`)),
    remove(ref(db, `${base}/discussionPhase`)),
    // deckConfig は残しても良いが、要望が「戻す」なので消す（次回ホストが初期化）
    remove(ref(db, `${base}/deckConfig`)),
  ]);

  state.seatedTable = null;
  startPop.classList.add('hidden');
  await syncSeatUI();
});
</script>
